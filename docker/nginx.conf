server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/plain application/json;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Routes live in the #-part of the URL, so every path is the one page. Projects and data
    # stay in the browser; the server only ever hands out this file.
    location / {
        try_files $uri /index.html;
        # Revalidate every time, so a new image reaches everyone on the next reload.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
